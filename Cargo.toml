[workspace]
resolver = "2"
members = [
    "crates/mediastat-core",
    "crates/mediastat-scanner",
    "crates/mediastat-storage",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
mediastat-core = { path = "crates/mediastat-core" }
mediastat-scanner = { path = "crates/mediastat-scanner" }
mediastat-storage = { path = "crates/mediastat-storage" }

# Concurrency & Core Utilities
rayon = "1.10"
crossbeam-channel = "0.5"
parking_lot = "0.12"
ahash = { version = "0.8", features = ["serde"] }
bitflags = { version = "2.6", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
num_cpus = "1.16"
regex = "1.11"

# Filesystem & Hashing
blake3 = "1.5"
sha2 = "0.10"
md-5 = "0.10"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_NetworkManagement_WNet",
] }

# On-demand thumbnail preview (GUI Inspector only)
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp", "webp", "gif", "tiff", "tga"] }

# Storage, CLI & Export
rusqlite = { version = "0.32", features = ["bundled"] }
csv = "1.3"
clap = { version = "4.5", features = ["derive"] }

# Desktop GUI (Pure Rust GPU-accelerated)
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "wgpu", "persistence", "wayland", "x11"] }
egui = "0.31"
egui_extras = "0.31"
rfd = "0.15"

# Testing
tempfile = "3.14"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
